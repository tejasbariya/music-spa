<div class="login-container">
    <div class="glass-panel">

        <div class="auth-banner">
            <div class="auth-icon">
                <span class="material-symbols-outlined">music_note</span>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to your MusicSPA account</p>
        </div>

        <div class="auth-body">
            <form id="login-form" ng-submit="login()">

                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" ng-model="email" placeholder="you@example.com" required>
                </div>

                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" ng-model="password" placeholder="••••••••" required>
                </div>

                <div ng-if="msg" class="msg">{{ msg }}</div>

                <button type="submit" class="btn auth-submit" ng-disabled="loading">
                    <span ng-if="!loading">Sign in</span>
                    <span ng-if="loading">Signing in…</span>
                </button>

                <div class="auth-switch">
                    No account? <a href="#!/register">Create one</a>
                </div>

            </form>
        </div>

    </div>
</div>
