<div class="player-wrapper" ng-init="loadLibrary()" ng-class="{'is-playing': isPlaying}">
    <div class="glass-panel player" ng-class="{'is-playing': isPlaying}">

        <!-- ── ART ZONE ── -->
        <div class="player-art-zone">

            <!-- Blurred background pulled from album art via JS -->
            <div class="player-art-blur" id="artBlur"></div>

            <!-- Album circle -->
            <div class="player-art-circle">
                <div class="art-img-wrap">
                    <img ng-if="currentSong.img && currentSong.img !== 'imgs/default.png'"
                         ng-src="{{ currentSong.img }}"
                         id="artImg">
                    <span ng-if="!currentSong.img || currentSong.img === 'imgs/default.png'"
                          class="material-symbols-outlined">album</span>
                </div>
            </div>

            <!-- Song info overlaid bottom of art zone -->
            <div class="player-art-info">
                <div class="player-song-name">{{ currentSong.name || 'Nothing playing' }}</div>
                <div class="player-song-artist">{{ currentSong.artistName || 'Local Library' }}</div>
            </div>
        </div>

        <!-- ── CONTROLS ZONE ── -->
        <div class="player-controls-zone">

            <!-- Progress bar -->
            <div class="progress-section">
                <div class="progress-track" ng-click="seek($event)">
                    <div class="progress-buffered" ng-style="{ width: progressBuffered || '0%' }"></div>
                    <div class="progress-played"   ng-style="{ width: progressPercent  || '0%' }">
                        <div class="progress-thumb"></div>
                    </div>
                </div>
                <div class="progress-times">
                    <span>{{ currentTime || '0:00' }}</span>
                    <span>{{ duration    || '--:--' }}</span>
                </div>
            </div>

            <!-- Playback controls -->
            <div class="song-controls">
                <button class="ctrl-btn" ng-click="prev()" title="Previous">
                    <span class="material-symbols-outlined">skip_previous</span>
                </button>
                <button class="ctrl-btn play-pause-btn" ng-click="playPause()">
                    <span class="material-symbols-outlined">{{ isPlaying ? 'pause' : 'play_arrow' }}</span>
                </button>
                <button class="ctrl-btn" ng-click="next()" title="Next">
                    <span class="material-symbols-outlined">skip_next</span>
                </button>
            </div>

            <!-- Track count -->
            <div class="song-count">
                <span ng-if="songs.length > 0">
                    {{ currentSongIndex + 1 }}&thinsp;/&thinsp;{{ songs.length }}&ensp;tracks
                </span>
                <span ng-if="songs.length === 0">
                    Library empty —&nbsp;<a href="#!/upload">upload a song</a>
                </span>
            </div>

        </div>

        <!-- Hidden audio -->
        <audio id="audio" ng-src="{{ currentSong.src }}"></audio>

    </div>
</div>

<script>
// Update blurred background when art changes
(function() {
    var scope = angular.element(document.querySelector('[ng-controller]')).scope();
    // Watch via MutationObserver on the img element
    var observer = new MutationObserver(function() {
        var img = document.getElementById('artImg');
        var blur = document.getElementById('artBlur');
        if (img && blur) {
            blur.style.backgroundImage = 'url(' + img.src + ')';
        }
    });
    observer.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['src', 'ng-src'] });
})();
</script>
