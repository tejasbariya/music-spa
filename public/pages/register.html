<div class="register-container">
    <div class="glass-panel">

        <div class="auth-banner">
            <div class="auth-icon">
                <span class="material-symbols-outlined">person_add</span>
            </div>
            <h2>Create account</h2>
            <p>Join MusicSPA and start listening</p>
        </div>

        <div class="auth-body">
            <form id="login-form" ng-submit="register()">

                <div class="auth-field">
                    <label>Username</label>
                    <input type="text" ng-model="username" placeholder="Choose a username" required>
                </div>

                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" ng-model="email" placeholder="you@example.com" required>
                </div>

                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" ng-model="password" placeholder="Min. 6 characters" required minlength="6">
                </div>

                <div ng-if="msg" class="msg">{{ msg }}</div>

                <button type="submit" class="btn auth-submit" ng-disabled="loading">
                    <span ng-if="!loading">Create account</span>
                    <span ng-if="loading">Creating…</span>
                </button>

                <div class="auth-switch">
                    Already have an account? <a href="#!/login">Sign in</a>
                </div>

            </form>
        </div>

    </div>
</div>
